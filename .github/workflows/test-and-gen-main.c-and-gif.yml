name: test and generate main.c and gif
on: 
  push:
    paths: '*.c'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: $GITHUB_WORKFLOW
  cancel-in-progress: false
jobs:
  test-and-gen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    - run: |
        cargo install --git https://github.com/asciinema/agg
        cargo install --locked --git https://github.com/asciinema/asciinema
        gcc test_gen.c -o test_gen
        asciinema rec main.cast -c ./test_gen --return
        agg main.cast main.gif --rows 100 --cols 40
        git add main.gif main.c
        git config --global user.email "$GITHUB_REPOSITORY_OWNER_ID+$GITHUB_REPOSITORY_OWNER@users.noreply.github.com"
        git config --global user.name "$GITHUB_REPOSITORY_OWNER"
        git commit -m "$GITHUB_WORKFLOW" || true
        git push || true
